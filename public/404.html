<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>正在跳转…</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; color: #4c5259;
        font-family: Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        display: grid; place-items: center; }
      .b { text-align: left; line-height: 1.8; max-width: 22rem; }
      .b b { display: block; font-family: 'LXGW WenKai', 'PingFang SC', serif; font-weight: 700;
        font-size: 26px; color: #111214; margin-bottom: 10px; }
      .b span { font-size: 14px; color: #6f757d; }
      .bar { margin-top: 20px; height: 1px; background: #e5e5e3; overflow: hidden; }
      .bar i { display: block; height: 100%; width: 40%; background: #d8402a;
        animation: go 1.1s cubic-bezier(.16,1,.3,1) infinite; }
      @keyframes go { 0% { transform: translateX(-100%) } 100% { transform: translateX(350%) } }
      @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100% } }
    </style>
  </head>
  <body>
    <div class="b">
      <b>正在跳转</b>
      <span>这个地址没有对应文件，正在回到首页。</span>
      <div class="bar"><i></i></div>
    </div>
    <script>
      (function () {
        var path = location.pathname + location.search + location.hash;
        try { sessionStorage.setItem('vx:redirect', path); } catch (e) {}
        location.replace('/');
      })();
    </script>
  </body>
</html>
